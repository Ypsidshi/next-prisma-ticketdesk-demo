services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketdesk
      POSTGRES_PASSWORD: ticketdesk
      POSTGRES_DB: ticketdesk
    ports:
      - "5434:5432"
    volumes:
      - ticketdesk_pg:/var/lib/postgresql/data

volumes:
  ticketdesk_pg:
